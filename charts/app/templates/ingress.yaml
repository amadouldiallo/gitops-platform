{{- /*
Désactivé par défaut (ingress.enabled=false) tant que l'Ingress Controller
et cert-manager (Étape 5, voir k8s/cert-manager/) ne sont pas installés.
Le routage ci-dessous ("/" → frontend, "/api" → backend) est déjà celui
que apps/frontend/nginx.conf.template utilise en local — RIEN à changer
côté appli quand cet Ingress prend le relais.
*/ -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    {{- if .Values.ingress.tls }}
    # ingress-shim (composant de cert-manager) surveille CETTE annotation
    # sur n'importe quel Ingress du cluster : dès qu'il la voit, il crée
    # lui-même la ressource Certificate correspondante — aucun Certificate
    # à déclarer à la main dans ce chart.
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ required "ingress.host est requis quand ingress.enabled=true" .Values.ingress.host | quote }}
      secretName: {{ .Release.Name }}-tls
  {{- end }}
  rules:
    - host: {{ required "ingress.host est requis quand ingress.enabled=true" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}

# =============================================================================
# ResourceQuota — le budget électrique max de l'appartement
# =============================================================================
#
# 🎯 Le concept
# Une borne sur la somme des ressources que TOUT le namespace peut
# consommer au total (pas par pod — ça, c'est le rôle du LimitRange à
# côté). Une fois ce quota posé, Kubernetes REFUSE la création de tout
# nouveau pod qui le dépasserait, à l'admission — pas après coup.
#
# ❓ Pourquoi c'est important
# Sans quota, un bug (ex. une boucle qui crée des pods en rafale, un
# autoscaler mal configuré côté appli) peut consommer toutes les
# ressources du cluster et affamer tout ce qui tourne à côté — y compris
# des choses qui n'ont rien à voir avec ce namespace.
#
# ⚠️ Piège — dès que ce quota existe, TOUT pod créé dans ce namespace DOIT
# déclarer ses requests ET limits cpu/memory, ou son admission est
# refusée. C'est ce qui a forcé l'ajout de `postgres.resources` dans
# charts/app/values.yaml (jusqu'ici absent, cette lacune ne posait
# problème qu'à partir de ce point précis du guide).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: task-tracker-quota
  namespace: task-tracker
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "3"
    limits.memory: 2Gi
    pods: "10"
    persistentvolumeclaims: "2"

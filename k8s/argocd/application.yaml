# =============================================================================
# Application Argo CD — Git devient la seule source de vérité
# =============================================================================
#
# 🎯 Le concept
# Argo CD compare en continu l'état RÉEL du cluster à l'état DÉCLARÉ dans
# `charts/app` sur la branche `main` de ce dépôt. `selfHeal: true` va plus
# loin qu'un simple déploiement au push : tout écart détecté À TOUT MOMENT
# (pas seulement après un commit) est automatiquement corrigé — un
# `kubectl scale`/`kubectl edit` manuel est ramené à l'état déclaré en
# quelques secondes.
#
# 🧠 Analogie
# Un thermostat. Tu définis la température désirée dans Git ; Argo CD
# corrige en continu l'écart avec la température réelle du cluster, sans
# intervention manuelle.
#
# ⚠️ Piège rencontré pour de vrai en éditant ce fichier à l'Étape 7 — Argo
# CD réconcilie `charts/app` en continu (c'est TOUT l'intérêt de
# selfHeal), mais ne surveille PAS son propre `spec.source` de la même
# façon : cette ressource `Application` reste un objet Kubernetes ordinaire.
# Un commit qui modifie CE fichier (ex. le passage de postgres.password à
# postgres.existingSecret ci-dessous) n'est PAS repris tout seul — il faut
# réappliquer `kubectl apply -f k8s/argocd/application.yaml` à chaque fois,
# exactement comme au tout premier bootstrap. Vécu concrètement : après un
# `git push`, `kubectl describe application` affichait déjà la nouvelle
# révision Git dans son statut, mais `spec.source.helm.valuesObject`
# restait l'ANCIENNE valeur tant que ce kubectl apply n'avait pas été
# refait — les pods continuaient donc de pointer vers l'ancien Secret.
# Un `ApplicationSet` (désactivé ici, voir README) ou un pattern
# "app-of-apps" existent précisément pour éliminer cette étape manuelle
# résiduelle.
#
# ✅ Étape 7 résolue : plus aucun mot de passe en clair ici.
# `postgres.existingSecret` pointe vers `task-tracker-vault-postgres`, un
# Secret Kubernetes ALIMENTÉ par un ExternalSecret (voir
# k8s/external-secrets/externalsecret.yaml), lui-même synchronisé depuis
# Vault via External Secrets Operator (k8s/external-secrets/) — jamais
# géré par ce chart Helm ni par Argo CD (voir la condition
# `{{- if not .Values.postgres.existingSecret }}` dans
# charts/app/templates/backend-secret.yaml, qui ne crée plus rien dès que
# ce champ est renseigné).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-tracker
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/amadouldiallo/gitops-platform.git
    targetRevision: main
    path: charts/app
    helm:
      valueFiles:
        - values-dev.yaml
      valuesObject:
        imageRegistry: europe-west1-docker.pkg.dev/devops-498817/gitops-images
        postgres:
          existingSecret: task-tracker-vault-postgres # voir l'avertissement ci-dessus — plus de valeur en clair
        ingress:
          enabled: true
          tls: true
          host: 34-34-138-87.nip.io # IP du LoadBalancer ingress-nginx — change si le service est recréé
          clusterIssuer: letsencrypt-prod

  destination:
    server: https://kubernetes.default.svc
    namespace: task-tracker

  syncPolicy:
    automated:
      prune: true # supprime du cluster ce qui a été retiré de Git
      selfHeal: true # corrige tout écart détecté, pas seulement au push
    syncOptions:
      - CreateNamespace=false # le namespace est géré à part, voir k8s/namespace/

# =============================================================================
# ClusterSecretStore — le pont entre Kubernetes et Vault
# =============================================================================
#
# 🎯 Le concept
# Déclare COMMENT External Secrets Operator doit s'authentifier auprès de
# Vault et OÙ chercher les secrets — une fois pour tout le cluster
# (`ClusterSecretStore`, par opposition à un `SecretStore` namespaced).
#
# ❓ Pourquoi l'auth Kubernetes plutôt qu'un jeton Vault statique
# La même philosophie que Workload Identity (voir terraform/modules/gke) :
# ESO présente le jeton de SA de SON PROPRE pod (`external-secrets`, voir
# vault-setup.md, étape 3) — Vault le vérifie directement auprès de l'API
# Kubernetes, sans qu'aucun jeton Vault statique n'ait jamais eu besoin
# d'être généré, distribué, ou stocké dans un Secret Kubernetes quelque
# part. Retirer l'accès = supprimer le rôle Vault, aucune clé à révoquer.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-task-tracker"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

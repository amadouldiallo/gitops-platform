{{- /*
⚠️ Piège volontairement documenté — ce Secret, géré directement par Helm
à partir de .Values.postgres.password, est un raccourci de DÉVELOPPEMENT
LOCAL, pas le modèle final. Un mot de passe passé par --set finit dans
l'historique `helm history` en clair — c'est exactement le problème que
l'Étape 7 (External Secrets Operator + Vault) viendra résoudre. Une fois
l'Étape 7 en place, values-prod.yaml pointera vers postgres.existingSecret
(un Secret alimenté par Vault, hors du contrôle de Helm) et ce template ne
générera plus rien du tout pour cet environnement — voir la condition
ci-dessous.
*/ -}}
{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.postgresSecretName" . }}
type: Opaque
stringData:
  password: {{ required "postgres.password est requis quand postgres.existingSecret n'est pas défini (--set postgres.password=... au moment de l'install, jamais commité)" .Values.postgres.password | quote }}
{{- end }}

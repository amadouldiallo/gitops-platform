# =============================================================================
# ServiceAccounts dédiés — un par composant, jamais le SA "default"
# =============================================================================
#
# 🎯 Le concept
# Sans ServiceAccount explicite, un pod hérite du SA "default" du
# namespace — partagé par tout ce qui ne s'en préoccupe pas, un signe que
# personne n'a réfléchi à ce qu'il faut réellement. Un SA par composant,
# même sans le moindre rôle RBAC attaché (notre cas ici : aucun de ces
# composants n'appelle l'API Kubernetes), permet de désactiver le montage
# automatique du jeton — voir automountServiceAccountToken ci-dessous.
#
# ⚠️ Les noms ("task-tracker-frontend", etc.) DOIVENT correspondre à
# `{{ .Release.Name }}-<composant>` du chart Helm (voir
# charts/app/templates/*-deployment.yaml et db-statefulset.yaml) — donc à
# `helm install task-tracker charts/app ...`. Un autre nom de release
# exigerait d'adapter ces ServiceAccounts en conséquence.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-tracker-frontend
  namespace: task-tracker
# false : ce pod ne parle jamais à l'API Kubernetes (seulement au
# backend, en HTTP applicatif) — monter un jeton qu'il n'utilisera jamais
# n'est qu'une surface d'attaque gratuite en cas de compromission du pod.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-tracker-backend
  namespace: task-tracker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-tracker-db
  namespace: task-tracker
automountServiceAccountToken: false

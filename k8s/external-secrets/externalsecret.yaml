# =============================================================================
# ExternalSecret — synchronise Vault -> un vrai Secret Kubernetes
# =============================================================================
#
# 🎯 Le concept
# ESO relit `secret/task-tracker/postgres` dans Vault toutes les
# `refreshInterval`, et maintient un Secret Kubernetes standard
# (`task-tracker-vault-postgres`) synchronisé avec son contenu. Le backend
# et Postgres, eux, continuent de lire un `secretKeyRef` Kubernetes
# ordinaire (voir charts/app/templates/backend-deployment.yaml et
# db-statefulset.yaml) — ils n'ont JAMAIS besoin de parler à Vault
# directement, ni de savoir qu'il existe.
#
# ❓ Pourquoi c'est important
# C'est précisément le nom de ce Secret cible qui remplace
# `postgres.password` (en clair, dans Git) par `postgres.existingSecret`
# (une référence, jamais la valeur elle-même) dans les values du chart —
# voir k8s/argocd/application.yaml après cette étape.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: task-tracker-postgres
  namespace: task-tracker
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: task-tracker-vault-postgres
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: task-tracker/postgres
        property: password
